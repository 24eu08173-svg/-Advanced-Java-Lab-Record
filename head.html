<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Inter", sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 40px; 
            background: transparent; 
        }
        .left-section { display: flex; align-items: center; gap: 20px; }
        .profile-img {
            width: 80px; height: 80px;
            border-radius: 50%; border: 3px solid #10b981;
            object-fit: cover;
        }
        h1 { font-size: 28px; font-weight: 800; color: #111827; }
        .sub-text { color: #6b7280; font-size: 14px; font-weight: 600; margin-top: 2px; }
        .highlight { color: #10b981; }
        @media (max-width: 600px) {
            body { flex-direction: column; justify-content: center; padding: 10px; gap: 10px; }
            .left-section { flex-direction: column; text-align: center; gap: 10px; }
            .profile-img { width: 60px; height: 60px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="left-section">
        <img src="profile.jpg" class="profile-img" alt="Profile">
        <div>
            <h1>Nakka Sailendra <span class="highlight">Prasad</span></h1>
            <div class="sub-text">Student ID: 24EU08173</div>
        </div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #9ca3af;">Advanced Java Lab</div>
</body>
</html>
