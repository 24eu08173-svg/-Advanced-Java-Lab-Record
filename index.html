<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Advanced Java Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Three.js for the Animated Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: "Inter", sans-serif; overflow: hidden; background: #f7fcf9; }

        /* ===== YOUR 3D AURORA BACKGROUND ===== */
        #three-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
        .bg-shapes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; }
        .shape-1 { width: 600px; height: 600px; background: #e0f7f1; top: -15%; right: -10%; opacity: 0.6; filter: blur(60px); }
        .shape-2 { width: 400px; height: 400px; background: #c8eee3; bottom: -10%; left: -10%; opacity: 0.6; filter: blur(60px); }

        /* ===== CENTER THE CARD ===== */
        .main-container {
            position: relative; z-index: 10;
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        /* ===== THE WELCOME CARD (Glassmorphism/Mint) ===== */
        .welcome-card {
            width: 100%; max-width: 800px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 50px 60px;
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.04), 0 5px 15px rgba(0, 0, 0, 0.02);
            gap: 30px;
            transition: transform 0.3s ease;
        }
        .welcome-card:hover { transform: translateY(-5px); }

        /* ----- LEFT SIDE (TEXT) ----- */
        .text-side {
            flex: 1;
            display: flex; flex-direction: column; gap: 15px;
        }
        .small-badge {
            font-size: 13px; font-weight: 600; color: #6b7280; letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }
        .small-badge::before {
            content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; display: inline-block;
        }

        h1 {
            font-size: clamp(42px, 5vw, 60px);
            font-weight: 800; line-height: 1.1; letter-spacing: -2px; color: #0f172a;
        }
        .highlight-green { color: #10b981; }

        .student-id {
            font-size: 16px; color: #4b5563; font-weight: 500; margin-top: 5px;
        }

        .btn-black {
            margin-top: 10px;
            padding: 14px 32px;
            background: #0f172a;
            color: #ffffff;
            border: none; border-radius: 60px;
            font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
            transition: 0.3s ease;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-black:hover {
            background: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
        .btn-black span { font-size: 18px; line-height: 0; }

        /* ----- RIGHT SIDE (PHOTO) ----- */
        .photo-side {
            flex-shrink: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .photo-circle {
            width: 160px; height: 160px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid rgba(16, 185, 129, 0.3);
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease;
        }
        .photo-circle:hover { transform: scale(1.05) rotate(-3deg); }
        .photo-circle img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .welcome-card { flex-direction: column-reverse; text-align: center; padding: 35px 25px; }
            .text-side { align-items: center; }
            .btn-black { justify-content: center; width: 100%; }
            .photo-circle { width: 120px; height: 120px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="bg-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div></div>
    <canvas id="three-bg"></canvas>

    <!-- ===== WELCOME CONTENT ===== -->
    <div class="main-container">
        <div class="welcome-card">
            
            <div class="text-side">
                <div class="small-badge">Advanced Java Lab</div>
                <h1>
                    Nakka Sailendra<br>
                    <span class="highlight-green">Prasad</span>
                </h1>
                <div class="student-id">Student ID: 24EU08173</div>
                <button class="btn-black" onclick="window.location.href='lab-work.html'">
                    Enter Lab Work <span>›</span>
                </button>
            </div>

            <div class="photo-side">
                <div class="photo-circle">
                    <img src="profile.jpg" alt="Nakka Sailendra Prasad">
                </div>
            </div>

        </div>
    </div>

    <!-- ===== THREE.JS ANIMATION SCRIPT ===== -->
    <script>
        const canvas = document.getElementById('three-bg');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0xccd9e0, 1);

        const auroraGroup = new THREE.Group();
        const waveCount = 35; 
        const geometry = new THREE.PlaneGeometry(30, 8, 64, 64);
        const colors = [0xa8e6cf, 0xdcedc1, 0xffd3b6, 0xffaaa5];
        for(let i = 0; i < waveCount; i++) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const material = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.1 + Math.random() * 0.1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
            const wave = new THREE.Mesh(geometry, material);
            wave.position.x = (Math.random() - 0.5) * 15; wave.position.y = (Math.random() - 0.5) * 10 - 2; wave.position.z = (Math.random() - 0.5) * 10 - 5;
            wave.rotation.x = Math.random() * Math.PI * 2; wave.rotation.y = Math.random() * Math.PI * 2; wave.rotation.z = Math.random() * Math.PI * 2;
            wave.userData = { offset: Math.random() * 100 };
            auroraGroup.add(wave);
        }
        scene.add(auroraGroup);
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        document.addEventListener('mousemove', (e) => { targetX = (window.innerWidth / 2 - e.clientX) / 80; targetY = (window.innerHeight / 2 - e.clientY) / 50; });
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            mouseX += (targetX - mouseX) * 0.05; mouseY += (targetY - mouseY) * 0.05;
            camera.position.x = mouseX * 0.5; camera.position.y = mouseY * 0.3; camera.lookAt(0, 0, -2);
            auroraGroup.children.forEach((wave, index) => { wave.position.y += Math.sin(time + wave.userData.offset) * 0.001; wave.rotation.z += 0.001; wave.rotation.x += 0.001; });
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
