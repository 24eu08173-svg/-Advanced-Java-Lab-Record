<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: "Inter", sans-serif; 
            background: transparent; padding: 25px 20px; 
        }
        h3 { font-size: 18px; color: #111827; margin-bottom: 20px; }
        
        .menu-link {
            display: block; padding: 12px 16px; margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px; text-decoration: none;
            color: #4b5563; font-weight: 600; font-size: 14px;
            transition: 0.2s;
        }
        .menu-link:hover {
            background: #34d399; color: #ffffff; transform: translateX(5px);
        }

        .divider { height: 1px; background: #e5e7eb; margin: 20px 0; width: 100%; }
        
        /* Style for external links so they don't turn green */
        .menu-link.external:hover {
            background: rgba(0,0,0,0.05); color: #4b5563;
        }
    </style>
</head>
<body>
    <h3>Menu</h3>
    
    <!-- Loads the default Main page -->
    <a href="main.html" target="contentFrame" class="menu-link">🏠 Home</a>
    
    <div class="divider"></div>

    <!-- 
       FIXED: This now goes BACK to your Welcome Card (index.html).
       It won't cause that weird double-layout loop anymore!
    -->
    <a href="index.html" target="contentFrame" class="menu-link" style="background: #34d399; color: white; font-weight: 700;">
        🏠 Back to Welcome
    </a>

    <div class="divider"></div>

    <!-- EXTERNAL LINKS (Opens in new tab due to security) -->
    <a href="https://www.google.com" target="_blank" class="menu-link external">🔍 Google</a>
    <a href="https://www.wikipedia.org" target="_blank" class="menu-link external">📚 Wikipedia</a>
    <a href="https://www.github.com" target="_blank" class="menu-link external">💻 GitHub</a>

</body>
</html>
