
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week 12 - Advanced Java Programming Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #e8e8e8;
            color: #222;
        }

        /* HEADER */
        .header {
            background: #F3F8FF;
            color: #17416B;
            text-align: center;
            padding: 20px 10px;
            border: 1px solid #D7E7FA;
            border-radius: 0 0 12px 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            color: #17416B;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            color: #3975B9;
        }

        /* LAB RECORD PAGES */
        .pages-container {
            max-width: 1100px;
            margin: auto;
            padding: 15px;
        }

        .page {
            background: white;
            margin-bottom: 25px;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 10px #0002;
            text-align: center;
        }

        .page img {
            display: block;
            width: 100%;
            height: auto;
            margin: auto;
        }

        /* FOOTER */
        footer {
            background: #F3F8FF;
            color: #17416B;
            text-align: center;
            padding: 15px;
            margin-top: 25px;
            border-top: 1px solid #D7E7FA;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 21px;
            }

            .header p {
                font-size: 13px;
            }

            .pages-container {
                padding: 8px;
            }

            .page {
                padding: 6px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>ADVANCED JAVA PROGRAMMING LAB</h1>
        <p>WEEK 12 – Spring Data JPA with MySQL Relation</p>
    </div>

    <!-- LAB RECORD PAGES -->
    <div class="pages-container">

        <div class="page">
            <img src="WEEK 12_page-0001.jpg"
                 alt="Week 12 Lab Record Page 1">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0002.jpg"
                 alt="Week 12 Lab Record Page 2">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0003.jpg"
                 alt="Week 12 Lab Record Page 3">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0004.jpg"
                 alt="Week 12 Lab Record Page 4">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0005.jpg"
                 alt="Week 12 Lab Record Page 5">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0006.jpg"
                 alt="Week 12 Lab Record Page 6">
        </div>

        <div class="page">
            <img src="WEEK 12_page-0007.jpg"
                 alt="Week 12 Lab Record Page 7">
        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        Advanced Java Programming Lab | Week 12
    </footer>

</body>
</html>
